spring:
  application:
    name: spark-agent-engine

  # ── DataSource + HikariCP ────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/spark_ai
    username: root
    password: root123456
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: SparkAgentPool
      maximum-pool-size: 10
      minimum-idle: 3
      auto-commit: false          # @Transactional owns commit boundaries
      connection-timeout: 30000   # ms; fail-fast if pool exhausted
      idle-timeout: 600000        # 10 min before closing an idle connection
      max-lifetime: 1800000       # 30 min hard cap; must be < PostgreSQL idle_in_transaction_session_timeout

  # ── JPA / Hibernate 7 ────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50            # batch INSERT for DeviceDataRepository.saveAll(); matched to typical message burst
          fetch_size: 100           # rows fetched per round-trip for large queries
          batch_versioned_data: true
        order_inserts: true         # group same-entity inserts so batching actually fires
        order_updates: true
        query:
          in_clause_parameter_padding: true   # pad IN(:ids) to powers of 2 → better statement cache hit rate
        format_sql: false
        generate_statistics: false

  # ── Spring Data Redis ────────────────────────────────────────────────────
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms   # connection + command timeout
      # Docker dev instance has --requirepass "redis123456";
      password: redis123456

  # ── Kafka ────────────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all                   # wait for all ISR replicas; required when idempotence=true
      retries: 3
      batch-size: 16384           # 16 KB; accumulate multiple telemetry events per send
      linger-ms: 5                # wait up to 5 ms to fill the batch before flushing
      compression-type: lz4       # fast compression; reduces bandwidth for JSON payloads
      properties:
        enable.idempotence: true                    # dedup retries; Kafka 4.x default, made explicit
        max.in.flight.requests.per.connection: 5    # max with idempotence enabled
    consumer:
      properties:
        # diagnose() can run 2 sequential LLM calls (up to 4 with the low-confidence retry),
        # each with a 150s timeout; default 300000ms was borderline and tripped false
        # rebalances (see listener.concurrency comment below for why calls queue up).
        max.poll.interval.ms: 600000
    listener:
      missing-topics-fatal: false   # don't crash if a consumer topic hasn't been created yet
      # iot.alert.triggered has 6 partitions, but Ollama's llama-server on this box runs
      # with -np 1 (one inference request at a time, CPU-only). Concurrency > 1 doesn't add
      # real parallelism here — it just makes multiple Kafka threads queue on the same
      # Ollama slot, each burning its own 150s per-call timeout while waiting. Match the
      # actual backend capacity instead of the partition count.
      concurrency: 1

  # ── Jackson 3.x ──────────────────────────────────────────────────────────
  # Jackson 3.x moved date features from SerializationFeature to DateTimeFeature (tools.jackson.databind.cfg)
  # Use spring.jackson.datatype.datetime.* instead of spring.jackson.serialization.*
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null   # omit null fields (root_cause, suggestion…) from REST responses
    datatype:
      datetime:
        write-dates-as-timestamps: false   # LocalDateTime → ISO-8601 string, not epoch array
        write-durations-as-timestamps: false

  # ── Spring AI / Ollama ───────────────────────────────────────────────────
  ai:
    model:
      embedding: ollama
      chat: ollama
    ollama:
      base-url: http://localhost:11434
      embedding:
        model: qwen3-embedding:0.6b
      chat:
        model: qwen3.5:4b
        # qwen3.5:4b auto-enables "thinking" mode (Ollama capability: "thinking") when this
        # is unset. Under multi-round tool-calling, the model's reasoning trace lands in the
        # separate `message.thinking` field, not `message.content` — ChatClient's .content()
        # only reads the latter. Empirically (4 trials, same tool-call context) this made the
        # model spend an unbounded, highly variable amount of output purely "thinking" (0 to
        # 1400+ tokens, one run exceeded 2 minutes) and occasionally finish a turn with empty
        # content, which is exactly what DiagnosisAgentService.runInference() was throwing
        # IllegalStateException for. Disabling thinking made every trial fast and non-empty.
        think: false
    mcp:
      server:
        name: spark-agent-engine-mcp
        version: 0.0.1-SNAPSHOT
        type: SYNC
        protocol: STREAMABLE

# ── Server ───────────────────────────────────────────────────────────────
server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1024       # only compress responses > 1 KB
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 100
    connection-timeout: 30s

# ── Actuator ─────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  info:
    env:
      enabled: true

info:
  app:
    name: spark-agent-engine
    description: "Industrial IoT Device AI Diagnosis Engine — Phase 1: Data Gateway"
    version: 0.0.1-SNAPSHOT

# ── Custom: MQTT ─────────────────────────────────────────────────────────
mqtt:
  host: localhost
  port: 1883
  topic: "/sys/+/+/thing/event/property/post"
  online-topic: "device/online/+"
  offline-topic: "device/offline/+"       # also catches the emulator's crash LWT: device/offline/emulator
  status-topic: "/sys/+/+/thing/event/status/post"
  client-id-prefix: spark-agent

# ── Custom: Business Rules ────────────────────────────────────────────────
app:
  alert-debounce-minutes: 5
  # Redis heartbeat TTL — device goes offline after this many seconds without a message
  # Set to ~2-3× the device reporting interval (devices typically report every 5-10 s)
  device-heartbeat-ttl-seconds: 30
  device-heartbeat-key-prefix: "device:online:"
  # diagnosis confidence gate — >= this, diagnosis_status=2 (auto); below, human_review_required
  diagnosis-confidence-threshold: 80
  # below this confidence, diagnose() retries once with a wider (120-min) history window
  diagnosis-retry-confidence-threshold: 40
  # timeout for a single LLM inference call during diagnosis (seconds). Also used as the
  # Ollama RestClient's HTTP read timeout (see OllamaHttpClientConfig) so a slow/hung call
  # actually closes its socket instead of just being abandoned by orTimeout() while it keeps
  # occupying Ollama's single (-np 1) inference slot.
  diagnosis-timeout-seconds: 150
  # outbox relay — polls aiot_outbox for unpublished rows and sends them to Kafka
  outbox-relay-interval-ms: 2000
  outbox-relay-batch-size: 100
  # outbox purge — deletes published aiot_outbox rows older than this many days
  outbox-purge-retention-days: 7
  outbox-purge-cron: "0 0 3 * * *"   # daily at 03:00
  # WebSocket telemetry bridge — how often TelemetryWsBridgeConsumer flushes its per-device
  # coalescing buffer to connected WS clients
  telemetry-ws-coalesce-interval-ms: 400
  # exact browser origins allowed to open the /ws STOMP endpoint (no wildcard — WS connections
  # aren't subject to normal browser CORS/same-origin protection the way REST fetch/XHR is)
  ws-allowed-origins:
    - http://localhost:3000

# ── Custom: Kafka Topics ──────────────────────────────────────────────────
kafka:
  topic:
    device-data: iot.device.data
    alert-triggered: iot.alert.triggered

# ── Logging ──────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.spark.agent: INFO
    # third-party noise reduction
    com.hivemq: WARN
    org.apache.kafka: WARN
    org.jctools: WARN
    # SQL debugging: flip to DEBUG / TRACE when needed
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
