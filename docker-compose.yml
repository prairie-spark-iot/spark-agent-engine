name: spark-agent-app

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile

    image: spark-agent-engine:latest
    container_name: spark-agent

    ports:
      - "${APP_PORT:-8080}:8080"

    environment:
      JAVA_TOOL_OPTIONS: >
        -XX:+UseZGC
        -XX:+ZGenerational
        -XX:InitialRAMPercentage=20
        -XX:MaxRAMPercentage=70
        -XX:+AlwaysPreTouch
        -XX:+UseCompactObjectHeaders
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp/heapdump.hprof
        -XX:+ExitOnOutOfMemoryError
        -Dfile.encoding=UTF-8
        -Djava.security.egd=file:/dev/urandom
        -Dsun.net.inetaddr.ttl=60
        -Dsun.net.inetaddr.negative.ttl=10

      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_HIKARI_AUTO_COMMIT: "false"

      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

      MQTT_HOST: ${MQTT_HOST}
      MQTT_PORT: ${MQTT_PORT}

      SERVER_SHUTDOWN: graceful
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 30s

      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"

      TZ: ${TZ}
      LOGGING_LEVEL_COM_SPARK_AGENT: ${LOG_LEVEL}

    volumes:
      - app-logs:/var/log/app

    logging: *default-logging

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

    deploy:
      resources:
        limits:
          cpus: "${APP_CPU_LIMIT}"
          memory: "${APP_MEM_LIMIT}"

    networks:
      - spark-net

volumes:
  app-logs:
    name: spark-app-logs

networks:
  spark-net:
    external: true
    name: spark-ai-infra_spark-net